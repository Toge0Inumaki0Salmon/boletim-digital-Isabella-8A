<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital - 8º Ano</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">8º Ano — Estudante Exemplo</p>
  </header>

  <!-- CARDS DE RESUMO (serão preenchidos pelo JavaScript) -->
  <section class="cards" id="cards">
    <div class="card">
      <span class="card-titulo">Média geral</span>
      <span class="card-valor" id="media-geral">—</span>
    </div>
    <div class="card">
      <span class="card-titulo">Total de faltas</span>
      <span class="card-valor" id="total-faltas">—</span>
    </div>
    <div class="card">
      <span class="card-titulo">Bom desempenho</span>
      <span class="card-valor" id="total-bom">—</span>
    </div>
    <div class="card">
      <span class="card-titulo">Precisam de atenção</span>
      <span class="card-valor" id="total-atencao">—</span>
    </div>
    <div class="card">
      <span class="card-titulo">Frequência</span>
      <span class="card-valor" id="frequencia">—</span>
      <span class="card-obs" id="frequencia-obs"></span>
    </div>
  </section>

  <!-- TABELA DE NOTAS -->
  <section class="tabela-area">
    <table class="boletim">
      <thead>
        <tr>
          <th>Disciplina</th>
          <th>1º Tri</th>
          <th>2º Tri</th>
          <th>3º Tri</th>
          <th>Média</th>
          <th>Faltas</th>
          <th>Situação</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela">
        <!-- As linhas serão criadas pelo JavaScript -->
      </tbody>
    </table>
  </section>

  <!-- RODAPÉ -->
  <footer class="rodape">
    <p>Projeto escolar fictício — dados apenas para demonstração.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
